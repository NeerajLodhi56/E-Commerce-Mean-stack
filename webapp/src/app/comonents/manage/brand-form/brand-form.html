<div class="flex flex-col items-center  px-40 mt-10">
@if(isEdit){
  <h1>Update Brands</h1>
}@else{
    <h4 class="text-xs">Add New Brands</h4>
}
<form class="shadow-sm w-96 p-6">

  <div class="flex flex-wrap">
    <div class="w-full">
      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput type="text" [(ngModel)]="name" name="name" placeholder="enter brand name">
      </mat-form-field>
    </div>
<div class="w-full flex justify-center">
   @if(isEdit){
 <button mat-raised-button color="primary"  (click)="update()">Update</button>
}@else{
    <button mat-raised-button color="primary" [disabled]="!name" (click)="add()">Add</button>
}

</div>
  </div>
</form>
</div>
